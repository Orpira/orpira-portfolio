title: WebWiz
order: 2
headline: >-
  Una plataforma para entrenar el trabajo real de un desarrollador: quizzes que miden la
  confianza, bugs que se depuran desde un ticket y código de IA que hay que revisar.
summary: >-
  Práctica de desarrollo web con quizzes con confianza, retos con tests en vivo,
  incidencias reales, revisión de código generado por IA y repaso espaciado.
ogLine: No memorices respuestas. Entrena el trabajo de un dev.
seoDescription: >-
  Caso de estudio de WebWiz: plataforma de práctica para desarrolladores con quizzes,
  retos con tests, incidencias, revisión de código de IA y laboratorios de SQL y Git.
