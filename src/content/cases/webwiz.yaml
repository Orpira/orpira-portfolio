architecture:
  summary: >-
    Una SPA que ejecuta los retos en el navegador y usa Supabase para cuentas, progreso
    y ranking. La IA vive en una Edge Function.
  layers:
    - label: Cliente
      items: [React, TypeScript, Vite, Zustand]
      note: Web y Android (Capacitor) desde el mismo código
    - label: Ejecución en el navegador
      items: [iframe aislado, Web Worker, PGlite, axe-core]
    - label: Servidor
      items: [Supabase Auth, PostgreSQL con RLS, Edge Functions]
    - label: IA
      items: [Claude API]
      note: Corrección de «Explícalo tú» y etiquetado del banco con revisión humana

stack:
  - layer: Interfaz
    tech: [React, TypeScript, Tailwind CSS, Zustand]
    why: Tema oscuro y claro con contraste AA, atajos de teclado y paleta de comandos.
  - layer: Ejecución
    tech: [Web Worker, iframe sandbox, PGlite]
    why: El código del usuario se ejecuta aislado, sin acceso a la sesión.
  - layer: Backend
    tech: [Supabase, PostgreSQL, Cloudflare Turnstile]
    why: Autenticación con Google, GitHub o email, RLS en cada tabla y CAPTCHA en el acceso.
  - layer: IA
    tech: [Claude API, Supabase Edge Functions]
    why: La clave y la rúbrica se quedan en el servidor.
  - layer: Calidad
    tech: [Vitest, Playwright, GitHub Actions]
    why: Cada reto e incidencia se verifica en CI antes de publicarse.
  - layer: Móvil
    tech: [Capacitor]
    why: APK y AAB para Android con la misma base de código.

