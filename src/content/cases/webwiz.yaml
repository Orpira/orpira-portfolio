problem:
  title: Acertar un test no es lo mismo que saber hacer el trabajo.
  paragraphs:
    - >-
      Los cuestionarios de programación premian memorizar respuestas. El trabajo diario
      es otro: leer un ticket, reproducir un fallo, revisar código ajeno (cada vez más,
      generado por IA) y no olvidar lo aprendido la semana anterior.
    - >-
      WebWiz empezó como una app de quizzes de HTML, CSS y JavaScript y ha crecido por
      fases hasta cubrir esas tareas, en español, en web y en Android.
  pending:
    - Para quién se pensó primero (bootcamp, autoaprendizaje, equipos) y cuántas personas la usan

decisions:
  - title: Preguntar por la confianza, no solo por la respuesta
    context: Un acierto adivinando y un acierto seguro no significan lo mismo.
    decision: >-
      Pedir la confianza antes de comprobar (Adivino, Creo que sí, Seguro) y usarla en el
      repaso espaciado FSRS por concepto: un fallo seguro vuelve antes que un acierto seguro.
    why: El repaso trae de vuelta lo que estás a punto de olvidar, no lo que ya dominas.
  - title: Los retos se corrigen con tests de verdad
    context: Validar código comparando texto no distingue una solución buena de una casualidad.
    decision: >-
      Ejecutar el código en un iframe aislado o en un Web Worker, con 2 s por test y
      protección frente a bucles infinitos. En CI se comprueba que el código inicial falla
      y que la solución pasa.
    why: Cada reto está verificado antes de publicarse.
  - title: Incidencias con tests ocultos y de regresión
    context: Depurar exige reproducir el fallo sin romper lo que ya funcionaba.
    decision: >-
      Cada incidencia trae un ticket, una mini-app rota, DevTools simuladas (Elementos,
      Consola, Red), tests de aceptación ocultos y tests de regresión visibles. El ticket
      solo se cierra si pasan los dos grupos.
    why: Se practica el ciclo completo de un bug, del reporte al arreglo mínimo.
  - title: La IA revisa, pero la clave nunca llega al cliente
    context: >-
      «Explícalo tú» corrige respuestas abiertas con Claude, y eso tiene coste y datos
      sensibles (la rúbrica).
    decision: >-
      Llamar a Claude desde una Supabase Edge Function, con la rúbrica fuera de la base de
      datos pública, validación del JSON de respuesta, caché por hash y límite diario por
      usuario.
    why: Coste acotado y una interfaz que no se rompe si la IA responde mal.

