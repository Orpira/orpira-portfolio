architecture:
  summary: >-
    Un monorepo con el motor de reglas y los bots como paquetes, un cliente React con la
    mesa en Three.js y una API Node.js que hace de árbitro de las partidas online.
  layers:
    - label: Reglas y bots
      items: [Motor determinista, Bots]
      note: Latino, Con robo y All Fives; individual o parejas.
    - label: Cliente
      items: [React, Three.js, Vite]
      note: Web en Vercel y APK Android con Capacitor.
    - label: Servidor
      items: [Node.js, API HTTP propia]
      note: Salas, liga, amigos, chat de frases y reloj de turno.
    - label: Despliegue
      items: [Docker, Nginx Proxy Manager, VPS]

stack:
  - layer: Interfaz
    tech: [React, TypeScript]
    why: Marcador, mano, salas, liga y cuenta en una sola aplicación.
  - layer: 3D
    tech: [Three.js]
    why: Mesa procedural ligera, sin modelos pesados que descargar.
  - layer: Servidor
    tech: [Node.js, Docker]
    why: Árbitro de las partidas online, sin dependencias externas en el adaptador HTTP.
  - layer: Móvil
    tech: [Capacitor]
    why: La misma web empaquetada como app Android.
  - layer: Calidad
    tech: [Pruebas de aceptación, Golden master]
    why: Reglas, bots, cliente y servidor se prueban en cada cambio.

