problem:
  title: Jugar al dominó a cuatro, como en la mesa de siempre, desde el móvil.
  paragraphs:
    - >-
      El dominó latino se juega a cuatro, por turnos y con reglas que cada mesa conoce de
      memoria. Llevarlo a una pantalla pide que la mesa se sienta real, que funcione sin
      conexión y que, cuando se juega con amigos a distancia, nadie pueda ver fichas ajenas
      ni jugar fuera de turno.
  pending:
    - Para quién se pensó primero y cuántas personas juegan al mes

decisions:
  - title: Un motor de reglas determinista, separado de la interfaz
    context: Una regla mal aplicada arruina la partida y la confianza en el juego.
    decision: >-
      Escribir las reglas como un paquete aparte (Latino, Con robo y All Fives, individual o
      por parejas, a 100, 150 o 200) y fijar el Latino con un golden master y partidas
      generativas que solo admiten jugadas legales.
    why: Cliente, bots y servidor aplican exactamente las mismas reglas.
  - title: El servidor decide, el cliente solo propone
    context: En una partida online, quien controla el estado controla la partida.
    decision: >-
      Cada sesión está ligada a un asiento; el cliente envía comandos con la revisión que
      espera, el servidor los procesa en serie y solo devuelve a cada jugador su propia vista
      de la mano.
    why: Nadie ve fichas ajenas ni juega por otro, y un reintento no duplica jugadas.
  - title: Una mesa 3D que se juega con un dedo
    context: Una mesa bonita no sirve si colocar una ficha en el móvil es difícil.
    decision: >-
      Mesa procedural en Three.js con brillo en los extremos jugables: se arrastra la ficha
      o se toca y se toca el brillo. Incluye movimiento reducido, sonido opcional y una mesa
      que se encoge si la jugada no cabe.
    why: La misma partida funciona en escritorio, en un móvil estrecho y en la app Android.
  - title: Jugar con gente, no solo contra la máquina
    context: El dominó es un juego social.
    decision: >-
      Salas privadas por código, invitación por enlace o WhatsApp, amigos con presencia,
      frases rápidas en la mesa con límite de envío, reloj de turno y una liga mensual.
    why: Se puede quedar con los de siempre aunque no estén en la misma casa.

