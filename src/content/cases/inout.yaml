problem:
  title: Las horas extra de una bodega no caben en una fórmula fija.
  paragraphs:
    - >-
      Inout nació en Java para calcular las horas extra de una operación logística con dos
      tipos de personal. El administrativo tiene horario fijo, y salir unos minutos tarde no
      es una hora extra. El de bodega trabaja por turnos rotativos, y cuando un despacho
      alarga el turno hay que pagar ese tiempo con el recargo nocturno, dominical o festivo
      que corresponda.
    - >-
      La legislación laboral colombiana complica el cálculo, porque cambia por fechas: la
      jornada semanal se reduce por tramos, la jornada nocturna empieza antes y el recargo
      dominical sube cada año. La versión anterior calculaba con valores fijos y por franjas
      horarias, fallaba al cruzar la medianoche y perdía marcaciones cuando la tablet se
      quedaba sin red.
  pending:
    - Cuántos empleados fichan y cuántos turnos se liquidan al mes

beforeAfter:
  - before: El valor de la hora se calculaba siempre con el mismo divisor.
    after: Se calcula con la jornada legal vigente en la fecha de cada turno.
  - before: Si un turno se quedaba sin salida, el sistema inventaba una.
    after: El turno pasa a «Por revisar» y un supervisor registra la hora real.
  - before: Sin red, las marcaciones se perdían al recargar la página.
    after: El kiosko guarda cada marcación y la envía al recuperar la conexión, sin duplicados.
  - before: El historial de cambios era un campo de texto.
    after: Cada corrección queda registrada con usuario, motivo y valores antes y después.

decisions:
  - title: Liquidar minuto a minuto
    context: El cálculo por franjas necesitaba casos especiales y fallaba cuando un turno cruzaba la medianoche.
    decision: >-
      Cada minuto trabajado se clasifica con las normas vigentes en la fecha de ese minuto,
      en hora de Colombia: ordinario o extra, diurno o nocturno, laborable, domingo o festivo.
    why: La medianoche, el paso a domingo o festivo y los cambios de norma se resuelven sin casos especiales.
  - title: Las normas tienen fecha de vigencia
    context: La jornada semanal, el inicio de la jornada nocturna y el recargo dominical cambian por ley en fechas concretas.
    decision: >-
      Los parámetros legales se guardan con su fecha de entrada en vigor, incluidos los
      cambios ya aprobados para fechas futuras. El calendario de festivos se calcula y se
      puede ajustar desde el panel.
    why: Un turno antiguo se liquida con la norma de su día, y el próximo cambio legal no exige tocar el código.
  - title: Un único paquete de reglas para el servidor y el cliente
    context: Las reglas duplicadas en dos sitios acaban dando resultados distintos.
    decision: >-
      Festivos, parámetros legales y motor de liquidación viven en un paquete TypeScript sin
      dependencias. El servidor lo usa para liquidar y el cliente para mostrar la franja
      nocturna, los festivos y la jornada legal.
    why: Las reglas están en un solo sitio y cubiertas por pruebas.
  - title: Fichar aunque no haya conexión
    context: La tablet de la entrada de una bodega no siempre tiene red.
    decision: >-
      El kiosko es una PWA que abre sin red, reconoce a cada empleado con un directorio local
      y guarda cada marcación con un identificador único. Al recuperar la conexión envía la
      cola en orden, y el servidor corrige el desfase si la tablet tenía la hora mal.
    why: Nadie se queda sin fichar, reenviar no duplica nada y lo que no se puede aplicar llega a un supervisor.
  - title: Las horas extra del personal administrativo se aprueban
    context: Quedarse diez minutos más en la oficina no debe pagarse como hora extra sin que nadie lo decida.
    decision: >-
      Cada horario define su tolerancia y si las extras requieren aprobación. Un supervisor
      las aprueba enteras, en parte o las rechaza, siempre con motivo. Si después se corrigen
      las horas del turno, la aprobación se anula y vuelve a quedar pendiente.
    why: La liquidación refleja lo que la empresa reconoce, y queda constancia de quién lo decidió.
  - title: Las pruebas se repiten en tres zonas horarias
    context: La app se desarrolla en España y se usa en Colombia.
    decision: >-
      En cada cambio, la integración continua ejecuta las pruebas en UTC, en hora de Madrid y
      en hora de Bogotá, contra un PostgreSQL real.
    why: El resultado de una liquidación no puede depender de la zona horaria del servidor.

