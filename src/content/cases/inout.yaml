architecture:
  summary: >-
    Un monorepo con tres piezas: un paquete de dominio sin dependencias, una API Fastify con
    PostgreSQL y una PWA en React. En producción la API sirve también la web: un solo proceso
    y un solo origen.
  layers:
    - label: Kiosko
      items: [Marcación, Directorio local, Cola sin conexión]
      note: Tablet en la entrada, con teclado numérico, lector de código de barras o cámara.
    - label: Panel
      items: [Personal en turno, Extras por aprobar, Liquidación, Horarios, Festivos]
      note: Acceso con sesión y rol de administrador o supervisor.
    - label: Dominio
      items: [Festivos, Parámetros legales, Motor de liquidación]
      note: Paquete compartido por el servidor y el cliente.
    - label: Servidor
      items: [Fastify, Drizzle ORM, PostgreSQL]
      note: En Docker, con las migraciones aplicadas al arrancar.

stack:
  - layer: Interfaz
    tech: [React, TypeScript, Vite, Tailwind CSS, TanStack Query]
    why: Una sola app para el kiosko y el panel de supervisión.
  - layer: Sin conexión
    tech: [PWA, Workbox]
    why: El kiosko abre y ficha aunque la tablet se reinicie sin red.
  - layer: API
    tech: [Node.js, Fastify, Zod]
    why: Validación de cada petición, sesiones por rol y límites de uso.
  - layer: Datos
    tech: [PostgreSQL, Drizzle ORM]
    why: Marcaciones, líneas de liquidación y auditoría en tablas normalizadas.
  - layer: Calidad
    tech: [Vitest, GitHub Actions]
    why: El motor de liquidación y la API se prueban en cada cambio.
  - layer: Despliegue
    tech: [Docker]
    why: La API y la web en un único contenedor.

