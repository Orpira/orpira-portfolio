learned:
  - Una regla legal con fecha no es una constante, es un dato con vigencia.
  - Guardar sin conexión no basta. Hay que poder reenviar sin duplicar.
  - Si el sistema no sabe una hora, es mejor que pregunte a que la invente.

next: >-
