learned:
  - Si el stock solo se escribe desde un sitio, siempre cuadra con su historia.
  - Trabajar sin conexión exige que reenviar no duplique nada.
  - La IA ahorra el tecleo, pero la confirmación sigue siendo de una persona.

next: >-
  Fase 2, por definir: entre lo aplazado están las fotos de la inspección de devoluciones.
