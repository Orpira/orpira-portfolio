architecture:
  summary: >-
    Una portada común desde la que se elige juego; cada juego usa el núcleo compartido de
    salas, turnos y puntuación, con Supabase para datos y ranking.
  layers:
    - label: Cliente
      items: [Next.js, TypeScript, Three.js]
      note: El Dominó 3D se renderiza en el navegador
    - label: Núcleo compartido
      items: [Salas con código, Turnos, Votos, Puntuación]
    - label: Servidor del dominó
      items: [Mesas en tiempo real, Bots, Modo automático]
      note: Juega por quien se desconecta o agota su tiempo
    - label: Datos
      items: [Supabase, PostgreSQL]

stack:
  - layer: Interfaz
    tech: [Next.js, TypeScript]
    why: Una ruta por juego y una portada común para cambiar de uno a otro.
  - layer: 3D
    tech: [Three.js]
    why: El tablero y las fichas del dominó en 3D, también en el móvil.
  - layer: Datos
    tech: [Supabase, PostgreSQL]
    why: Salas, partidas y ranking por juego.

