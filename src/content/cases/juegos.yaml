problem:
  title: Juegos de mesa de toda la vida, para jugar sin estar en la misma mesa.
  paragraphs:
    - >-
      Empezó con el «Stop» de papel: se elige una letra y cada jugador escribe una palabra
      por categoría. La idea era jugarlo en línea, varios a la vez, con puntuación y ranking.
    - >-
      Después llegaron más juegos de la misma clase. El reto pasó a ser otro: que añadir un
      juego no obligara a rehacer las salas, los turnos y el ranking cada vez.
  pending:
    - Cuánta gente juega y con qué frecuencia

decisions:
  - title: Un núcleo común y un módulo por juego
    context: >-
      El segundo juego repetía la mitad del código del primero: códigos de sala, sorteo de
      letra, recuento de votos y puntuación.
    decision: >-
      Separar lo genérico en un núcleo compartido y dejar en cada juego solo sus reglas. Lo
      que resultaba ser genérico al construir un juego nuevo se movía al núcleo.
    why: Cada juego nuevo reutiliza salas, turnos y ranking, y solo aporta sus reglas.
  - title: Las reglas de la partida las eligen los jugadores
    context: Cada grupo juega a su manera (cómo se validan las palabras, cuántos jugadores).
    decision: >-
      Las opciones se configuran en la sala antes de empezar y el juego las aplica durante
      la partida.
    why: La misma sala sirve para grupos distintos sin tocar el código.
  - title: Un ranking por juego que se reinicia cada semana
    context: Mezclar puntuaciones de juegos distintos no dice nada, y un ranking eterno deja de motivar.
    decision: >-
      Top 5 separado por juego, con las partidas y la fecha de la última, que empieza de
      cero cada lunes de madrugada (hora de España).
    why: Cada juego tiene su propia competición y siempre hay una semana nueva para entrar.
  - title: La partida de dominó no se para si alguien se va
    context: >-
      En una mesa de cuatro, un jugador que se desconecta o no juega a tiempo bloquea a
      los otros tres.
    decision: >-
      El servidor juega por quien agota su tiempo o pierde la conexión (modo automático,
      con aviso de la jugada) hasta que retoma el control, y si faltan personas completa la
      mesa con bots, siempre identificados como «Bot».
    why: La partida sigue para todos y nadie confunde un bot con una persona.

