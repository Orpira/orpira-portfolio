title: Private Balance
order: 1
headline: Finanzas privadas diseñadas alrededor del trabajo real, con los datos guardados en el dispositivo.
summary: >-
  Finanzas personales con privacidad por diseño: los datos se quedan en el dispositivo.
  Web, PWA y app Android con bloqueo por PIN.
