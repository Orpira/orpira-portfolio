architecture:
  summary: >-
    Un único dominio en React y TypeScript, con los datos en el dispositivo y dos formas
    de llegar al usuario.
  layers:
    - label: Interfaz
      items: [React, TypeScript]
    - label: Producto
      items: [Finanzas, Agenda, Temporadas, Copiloto]
      note: Reglas deterministas; la IA solo propone.
    - label: Datos locales
      items: [IndexedDB, Dexie]
      note: Los datos financieros no salen del dispositivo.
    - label: Distribución
      items: [PWA instalable, Android con Capacitor]

stack:
  - layer: Interfaz
    tech: [React, TypeScript, Vite, Tailwind CSS]
    why: Tipado estricto en un dominio con reglas financieras y una interfaz rápida de iterar.
  - layer: Datos
    tech: [IndexedDB, Dexie]
    why: Almacenamiento local con migraciones versionadas, coherente con el enfoque local-first.
  - layer: Distribución
    tech: [PWA, Capacitor, Vercel]
    why: Una sola base de código para web instalable y Android.
  - layer: Calidad
    tech: [Vitest]
    why: Las reglas financieras se prueban como funciones puras.

results:
  - value: "3"
    label: plataformas desde una sola base de código (web, PWA y Android)
  - value: "96"
    label: archivos de tests automatizados sobre las reglas del dominio
  - value: null
    label: usuarios activos
    pendingHint: Usuarios activos o en periodo de prueba

learned:
  - Simplificar también es diseñar. Quitar el cronómetro de la Agenda mejoró el producto.
  - Una preferencia de UX nunca debe modificar una regla financiera.
  - Interpretar una intención no equivale a tener permiso para modificar los datos.

next: >-
  Sincronización privada entre dispositivos (iPhone, iPad, Android y PC) sin renunciar al
  enfoque local-first, y salida comercial con licencias.
