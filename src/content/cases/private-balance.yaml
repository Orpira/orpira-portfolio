problem:
  title: Registrar dinero era solo una parte del problema.
  paragraphs:
    - >-
      Saber cuánto entra o cuánto sale no siempre explica cómo está funcionando una
      actividad profesional.
    - >-
      El verdadero reto era relacionar el trabajo realizado con el tiempo dedicado, los
      ingresos, los gastos y los objetivos de una temporada, sin convertir el registro
      diario en otra carga de trabajo. Y hacerlo con información financiera sensible que
      no debería vivir en el servidor de otro.

principles:
  - title: Privacidad
    text: La información financiera permanece bajo control del usuario.
  - title: Local-first
    text: El núcleo funciona sin depender de forma permanente de infraestructura remota.
  - title: Menos fricción
    text: Registrar y consultar exige el mínimo esfuerzo razonable.
  - title: Producto antes que tecnología
    text: Una tecnología entra cuando resuelve una necesidad, no porque sea posible.

decisions:
  - title: Local-first como decisión de arquitectura
    context: El producto trabaja con información financiera potencialmente sensible.
    decision: >-
      Mantener el núcleo de los datos en el dispositivo (IndexedDB) y reducir la
      dependencia de servidores para el funcionamiento principal.
    why: >-
      Más control sobre los datos y disponibilidad sin conexión. El coste es asumir
      mecanismos propios de copia, restauración y una futura sincronización.
  - title: Determinismo antes que IA
    context: >-
      El Copiloto entiende lenguaje natural, pero una interpretación probabilística no
      debe convertirse en permiso para modificar datos financieros.
    decision: >-
      Separar consultas de acciones. Las consultas responden sin tocar nada; las acciones
      se convierten en una propuesta estructurada que el usuario revisa y confirma.
    why: La inteligencia amplía la interfaz, pero no sustituye las garantías del dominio.
  - title: Una preferencia de interfaz no cambia una regla financiera
    context: >-
      La opción de ocultar avisos de ingresos pendientes podía confundirse con un cambio
      en los cálculos.
    decision: >-
      Separar de forma explícita las preferencias de interfaz de las reglas del dominio:
      la opción cambia qué se muestra, nunca cómo se calcula.
    why: El usuario tiene que poder confiar en que los números no dependen de un ajuste visual.

