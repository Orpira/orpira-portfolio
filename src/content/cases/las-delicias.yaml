architecture:
  summary: >-
    Una PWA en React desplegada en Vercel y una API Fastify con PostgreSQL en el servidor
    propio, que es la única fuente de datos para la web, el panel del personal y n8n.
  layers:
    - label: Clientes
      items: [Carta, Pedido con QR, Seguimiento]
      note: PWA en Vercel, en lasdelicias.orpira.es.
    - label: Personal
      items: [Barra, Cocina, Carta, QR, Cierre diario]
      note: Panel con acceso por usuario y rol.
    - label: Servidor
      items: [Fastify, PostgreSQL, SSE]
      note: En Docker detrás de Nginx Proxy Manager, con copia de seguridad diaria.
    - label: Ecosistema
      items: [n8n, WhatsApp, Instagram, Caja]
      note: Eventos firmados hacia n8n y una clave para que n8n cree pedidos.

stack:
  - layer: Interfaz
    tech: [React, TypeScript, Tailwind CSS]
    why: Una sola app para el cliente, la barra y la cocina, instalable en el móvil.
  - layer: API
    tech: [Node.js, Fastify, Zod]
    why: Validación estricta de cada petición y límites de uso por ruta.
  - layer: Datos
    tech: [PostgreSQL]
    why: Precios, cuentas y cierres en transacciones, y LISTEN/NOTIFY para el directo.
  - layer: Automatización
    tech: [n8n]
    why: Avisos por WhatsApp, pedidos por WhatsApp e integración con la caja sin tocar la app.
  - layer: Despliegue
    tech: [Docker, Vercel]
    why: La API en el servidor propio y la web en Vercel.

