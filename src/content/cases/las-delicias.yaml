problem:
  title: Un negocio sin web, con Instagram como único escaparate.
  paragraphs:
    - >-
      Las Delicias es una cafetería panadería de la calle Ayala, en Málaga, que no tenía
      web: solo Instagram. El objetivo era facilitar pedir, encargar y ser atendido en el
      local, para que los clientes vuelvan.
    - >-
      Además, web, WhatsApp, Instagram y caja tenían que trabajar con los mismos datos, en
      lugar de ser canales sueltos.
  pending:
    - Cuántos pedidos pasan por la app al día o al mes

beforeAfter:
  - before: Para ver la carta o los horarios, solo Instagram.
    after: Una web con la carta, la vitrina del día, el horario en directo y cómo llegar.
  - before: Para pedir en el local, esperar turno en la barra.
    after: Escaneas el QR de tu mesa, pides desde el móvil y sigues el pedido en directo.
  - before: Encargar es llamar o escribir y esperar respuesta.
    after: Encargo para recoger a una hora, confirmado al momento, con aviso en la barra.

decisions:
  - title: Un QR que no se puede falsificar
    context: Si el QR solo lleva el número de mesa, cualquiera puede pedir «a otra mesa» cambiando la URL.
    decision: >-
      Cada QR lleva un código secreto de 32 caracteres que se puede regenerar desde el
      panel. Si un móvil con un pedido en curso escanea otra mesa, se le pregunta si se ha
      cambiado y la barra ve el cambio declarado o sospechoso.
    why: Los pedidos llegan a la mesa correcta y el personal sabe cuándo algo no cuadra.
  - title: El servidor calcula los precios
    context: Un precio que viene del navegador se puede manipular.
    decision: >-
      El cliente solo envía productos y cantidades; la API recalcula precios y totales en
      PostgreSQL. Cada pedido lleva una clave de idempotencia para que un doble toque o un
      reintento no lo duplique.
    why: Lo que se cobra es lo que dice la carta, y no hay pedidos repetidos.
  - title: Barra y cocina en directo, sin recargar
    context: Un pedido que tarda en aparecer en la cocina es un cliente esperando.
    decision: >-
      PostgreSQL avisa de cada cambio (LISTEN/NOTIFY) y la API lo envía a barra, cocina y
      al móvil del cliente por eventos del servidor (SSE), con aviso sonoro en la barra.
    why: Todos ven el mismo estado del pedido en el mismo momento.
  - title: El horario lo decide el servidor
    context: Un móvil con otra zona horaria o una hora mal puesta no puede decidir si el local está abierto.
    decision: >-
      El horario se calcula en el servidor en hora de Madrid, con festivos y cambios de
      hora. Fuera de horario, los encargos se reservan para la siguiente apertura y pasan
      solos a la barra cuando llega la hora.
    why: Se pueden aceptar encargos con el local cerrado sin que la cocina los vea antes de tiempo.
  - title: Una sola fuente de datos para todo el ecosistema
    context: El negocio quería web, WhatsApp, Instagram y caja conectados.
    decision: >-
      La carta y la ficha del negocio salen de la misma API para la web y para n8n. Los
      eventos (pedido creado, cambio de estado, llamada de mesa, stock bajo) salen firmados
      hacia n8n, que puede avisar por WhatsApp o sincronizar el stock con la caja.
    why: Cambiar un precio o un horario en el panel lo cambia en todos los canales.

