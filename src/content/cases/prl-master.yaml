problem:
  title: El temario y el examen vivían en un documento Word.
  paragraphs:
    - >-
      Un documento se lee, pero no se puede practicar con él, no corrige y no sirve para
      evaluar a un grupo a la vez. Quien imparte formación en prevención de riesgos
      laborales necesita una herramienta ágil para comprobar en el aula lo que se ha
      aprendido.
  pending:
    - Quién usaba ese material (empresa, academia, alumnos) y cuántas personas se forman al año
    - Cómo se hacía antes el examen y la corrección, y cuánto tiempo costaba

decisions:
  - title: Las preguntas son datos, no páginas
    context: El examen original estaba en Word, mezclando formato y contenido.
    decision: >-
      Convertir el documento en un banco JSON de 174 preguntas, cada una con su categoría,
      y agrupar las 26 categorías en 7 bloques temáticos con buscador y recuento.
    why: >-
      Ampliar el temario es editar datos, y el formador elige qué evaluar sin tocar la
      aplicación.
  - title: Tres formas de examinar, la misma app
    context: No es lo mismo repasar en casa que evaluar a una clase.
    decision: >-
      Modo individual, multijugador por turnos en un solo dispositivo y modo en red, donde
      cada alumno entra desde su móvil con un código de sala (PRL-XXXX).
    why: Sirve igual con un proyector y un portátil que con una clase entera conectada.
  - title: El ranking se actualiza mientras la clase termina
    context: En el aula, esperar a que acaben todos para ver resultados enfría la sesión.
    decision: >-
      Un servidor Express con Socket.IO reparte las mismas preguntas barajadas a toda la
      sala y publica el ranking con medallas a medida que llegan los resultados. Si el
      anfitrión se desconecta, otro participante pasa a serlo.
    why: El formador ve en directo quién ha terminado y cómo va el grupo.
  - title: Corrección inmediata y ritmo configurable
    context: Un test sirve para aprender si explica el fallo en el momento.
    decision: >-
      Mostrar la respuesta correcta tras cada pregunta, barajar con Fisher-Yates en cada
      intento y dejar elegir cuántas preguntas (5 a 174) y un temporizador opcional por
      pregunta o por test.
    why: El mismo banco sirve para un repaso rápido o para un examen con tiempo.

