architecture:
  summary: >-
    Una SPA en React con Supabase para cuentas, roles y resultados, y un servidor Express
    que hace de puente con la IA.
  layers:
    - label: Interfaz
      items: [React, TypeScript, Vite, Tailwind CSS, Zustand]
      note: Modo estudio, examen, certificado, estadísticas y administración.
    - label: Datos y cuentas
      items: [Supabase Auth, PostgreSQL]
      note: Perfiles con rol, resultados de examen y fuentes del temario.
    - label: Servidor
      items: [Express, OpenAI API, pdf-parse]
      note: Asistente y clasificación de fuentes; la clave vive aquí.
    - label: Documentos
      items: [jsPDF]

stack:
  - layer: Interfaz
    tech: [React, TypeScript, Tailwind CSS, Zustand]
    why: Estado del alumno y del examen en un solo sitio, tipado de punta a punta.
  - layer: Datos
    tech: [Supabase, PostgreSQL]
    why: Autenticación, roles de usuario y administrador, e historial de exámenes.
  - layer: IA
    tech: [OpenAI API, Express]
    why: Asistente de PRL y clasificación de PDF o JSON sin exponer la clave.
  - layer: Certificado
    tech: [jsPDF]
    why: El certificado se genera en el navegador al aprobar.

