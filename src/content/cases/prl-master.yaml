architecture:
  summary: >-
    Una SPA en React que funciona sola para los modos individual y por turnos, y un
    servidor Express con Socket.IO para las salas en red.
  layers:
    - label: Interfaz
      items: [React, Vite, Tailwind CSS]
      note: Modos individual, por turnos y en red.
    - label: Contenido
      items: [Banco de 174 preguntas en JSON]
      note: 26 categorías en 7 bloques temáticos.
    - label: Tiempo real
      items: [Express, Socket.IO]
      note: Salas con código, ranking en directo y reconexión automática.

stack:
  - layer: Interfaz
    tech: [React, Vite, Tailwind CSS]
    why: Rápida en cualquier dispositivo del aula, incluido el móvil del alumno.
  - layer: Tiempo real
    tech: [Express, Socket.IO]
    why: WebSocket con alternativa por polling y reconexión transparente.
  - layer: Contenido
    tech: [JSON]
    why: El temario queda separado de la aplicación y se amplía sin tocar código.

