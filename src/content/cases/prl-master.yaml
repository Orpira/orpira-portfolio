problem:
  title: Estudiar con documentos no te dice qué estás fallando.
  paragraphs:
    - >-
      En el curso de prevención de riesgos laborales de 30 horas, el material
      llegaba en documentos PDF y Word. Un documento se lee, pero no se puede practicar
      con él, no corrige y no sirve para repasar en grupo.
    - >-
      Convertí ese material en PRL Master para que los compañeros del curso pudiéramos
      estudiar con preguntas, ver al momento qué fallábamos y repasar juntos.
  pending:
    - Una frase de un compañero o del formador sobre cómo les ayudó

beforeAfter:
  - before: Leer el temario sin saber qué parte dominas y cuál no.
    after: 170 preguntas por temas para practicar justo lo que flojea.
  - before: Descubrir los fallos el día del examen.
    after: Cada respuesta se corrige al momento y muestra la correcta.
  - before: Repasar en grupo sin forma de comparar resultados.
    after: Varios jugadores por turnos con el mismo test y un ranking al final.

decisions:
  - title: Las preguntas son datos, no páginas
    context: El examen original estaba en Word, mezclando formato y contenido.
    decision: >-
      Convertir el documento en un banco JSON de 170 preguntas, cada una con su
      categoría, y agrupar las 26 categorías en 7 bloques temáticos. Un test automático
      valida el banco: ids únicos, sin enunciados repetidos y respuestas válidas.
    why: >-
      Ampliar el temario es editar datos, y un error en el banco se detecta antes de
      publicarlo.
  - title: La B ya no es la respuesta
    context: >-
      En el banco original la opción correcta era la B en 83 de 174 preguntas; quien
      respondiera siempre B acertaba casi la mitad sin estudiar.
    decision: >-
      Barajar en cada test tanto las preguntas como sus opciones, recalculando cuál es la
      correcta, con tests que comprueban que cae en cada posición por igual.
    why: Un test solo sirve para estudiar si no se puede aprobar por patrón.
  - title: Elegir temas como quien lee señales
    context: Siete bloques y veintiséis temas en una lista eran demasiado scroll y poco claro.
    decision: >-
      Cada bloque es una señal de seguridad real (obligación, advertencia, salvamento) y
      cada tema una pegatina con su número de preguntas. Buscador sin tildes, botón
      «Sorpréndeme» y un contador con cinta de señalización.
    why: El tema de la app guía la interfaz, y se puede usar entera con teclado.
  - title: Un ranking justo por turnos
    context: >-
      En el modo por turnos cada jugador recibía preguntas distintas, así que el ranking
      comparaba exámenes diferentes.
    decision: >-
      El primer jugador configura el test y el resto responde exactamente las mismas
      preguntas, en el mismo orden, con el estado y los temporizadores reiniciados en
      cada turno.
    why: El ranking final compara a todos con el mismo examen.
  - title: Un servidor de salas que no se deja engañar
    context: >-
      El modo en red original se fiaba de la nota que enviaba cada jugador y mandaba las
      respuestas correctas a todos los navegadores.
    decision: >-
      El servidor guarda las respuestas, exige responder en orden y una sola vez,
      controla el tiempo y calcula él mismo el ranking. Está cubierto con tests de
      integración y pendiente de desplegar.
    why: Cuando las salas se publiquen, nadie podrá enviarse un 100 %.

