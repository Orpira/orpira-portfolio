architecture:
  summary: >-
    Una SPA en React que funciona sola para los modos individual y por turnos, y una
    API de salas en Node.js que es la autoridad del modo en red: corrige, controla el
    tiempo y guarda las salas en disco.
  layers:
    - label: Interfaz
      items: [React, Vite, Tailwind CSS]
      note: Modos individual, por turnos y en red; selector de temas con señales.
    - label: Contenido
      items: [Banco de 170 preguntas en JSON]
      note: 26 categorías en 7 bloques temáticos.
    - label: Salas en red
      items: [Node.js, API HTTP, JSON en disco, Docker]
      note: Sesión secreta por alumno, consultas cada segundo y reloj en el servidor.

stack:
  - layer: Interfaz
    tech: [React, Vite, Tailwind CSS]
    why: Rápida en cualquier dispositivo del aula, incluido el móvil del alumno.
  - layer: Salas en red
    tech: [Node.js, HTTP]
    why: >-
      Sin WebSockets: funciona detrás de cualquier proxy, y si el móvil se desconecta el
      alumno vuelve con su sesión.
  - layer: Despliegue
    tech: [Docker, Nginx Proxy Manager, Vercel]
    why: La API en un contenedor en el VPS, junto a la del Dominó 3D; la web en Vercel.
  - layer: Contenido
    tech: [JSON]
    why: El temario queda separado de la aplicación y se amplía sin tocar código.
  - layer: Calidad
    tech: [Vitest]
    why: Tests del banco, del barajado, del selector, de la API y una prueba de aula con 30 alumnos.

