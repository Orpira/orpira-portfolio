architecture:
  summary: >-
    Una SPA en React que funciona sola para los modos individual y por turnos, con la
    lógica del test en funciones puras probadas. El servidor de salas en red (Express y
    Socket.IO) está hecho y probado, pendiente de desplegar.
  layers:
    - label: Interfaz
      items: [React, Vite, Tailwind CSS]
      note: Modos individual y por turnos; selector de temas con señales.
    - label: Contenido
      items: [Banco de 170 preguntas en JSON]
      note: 26 categorías en 7 bloques temáticos.
    - label: Tiempo real
      items: [Express, Socket.IO]
      note: Salas con código; el servidor corrige y controla el tiempo. Pendiente de desplegar.

stack:
  - layer: Interfaz
    tech: [React, Vite, Tailwind CSS]
    why: Rápida en cualquier dispositivo del aula, incluido el móvil del alumno.
  - layer: Tiempo real
    tech: [Express, Socket.IO]
    why: Para las salas en red; el servidor valida cada respuesta y calcula el ranking.
  - layer: Contenido
    tech: [JSON]
    why: El temario queda separado de la aplicación y se amplía sin tocar código.
  - layer: Calidad
    tech: [Vitest]
    why: Tests del banco, del barajado, del selector y del servidor de salas.

