problem:
  title: El temario y el examen vivían en un documento Word.
  paragraphs:
    - >-
      Un documento se lee, pero no se puede practicar con él, no corrige y no deja
      constancia de quién ha aprobado. La formación en prevención de riesgos laborales
      necesita las tres cosas.
  pending:
    - Quién usaba ese material (empresa, academia, alumnos) y cuántas personas se forman al año
    - Cómo se hacía antes el examen y la corrección, y cuánto tiempo costaba

decisions:
  - title: Las preguntas son datos, no páginas
    context: El examen original estaba en Word, mezclando formato y contenido.
    decision: >-
      Convertir el documento en un banco tipado de 100 preguntas en 31 categorías, cada
      una con su resumen de teoría, separado de la interfaz.
    why: >-
      Actualizar o ampliar el temario pasa a ser editar datos, y cada pregunta se reutiliza
      en estudio, examen y estadísticas.
  - title: Estudiar y examinarse son experiencias distintas
    context: Practicar con ayuda y demostrar lo aprendido tienen reglas diferentes.
    decision: >-
      Separar un modo estudio, con teoría por categoría y corrección inmediata, de un
      examen cronometrado (90 s por pregunta) que corrige al final, desglosa el resultado
      por categoría y emite un certificado en PDF a partir del 60 %.
    why: El alumno aprende sin presión y el examen conserva su valor como prueba.
  - title: Probar sin cuenta, comprometerse con cuenta
    context: Pedir registro antes de enseñar nada espanta a quien solo quiere ver cómo es.
    decision: >-
      Un modo demo con 4 temas, 5 preguntas por tema y un examen, sin asistente IA. Con
      cuenta se abre todo el temario, el historial y las estadísticas.
    why: Se ve el valor antes de dar el email, y el coste de IA solo lo generan usuarios registrados.
  - title: La IA ayuda al alumno y a quien gestiona el contenido
    context: >-
      Las dudas aparecen mientras se estudia, y el temario nuevo llega en PDF o JSON sin
      clasificar.
    decision: >-
      Un asistente de PRL dentro de la app y un panel de administración que extrae el texto
      de cada fuente y propone sus categorías con IA, siempre a través del servidor.
    why: La clave de la API no llega al navegador y el administrador revisa antes de guardar.

