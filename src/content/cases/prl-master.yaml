  El material del curso de PRL de 30 horas, convertido en una app de tests para
  estudiar: a solas o por turnos, con corrección al momento y un selector de temas
  inspirado en las señales de seguridad.
summary: >-
  El material de un curso de PRL convertido en una app para estudiar: 170 preguntas por
  temas, opciones barajadas, corrección inmediata y ranking por turnos.
