title: EcoTogo
order: 2
headline: >-
  Informes de ecografía veterinaria que se organizan solos: las notas llegan por WhatsApp,
  la IA las clasifica y el informe parte de la plantilla correcta.
summary: >-
  Gestión de informes de ecografía veterinaria: tablero Kanban, notas de WhatsApp
  clasificadas con IA y generación de informes sobre plantillas Word.
ogLine: Informes de ecografía veterinaria que se organizan solos.
seoDescription: >-
  Caso de estudio de EcoTogo: gestión de informes de ecografía veterinaria con tablero
  Kanban, clasificación de notas de WhatsApp con IA y plantillas Word.
year: "2026"
role: Producto · Full Stack · IA
platform: Web
status: building
statusLabel: En desarrollo
tags: [React, Node.js, PostgreSQL, Claude API, WhatsApp]

problem:
  title: Las notas de cada ecografía llegaban por WhatsApp, mezcladas.
  paragraphs:
    - >-
      Cada estudio genera notas que hay que convertir en un informe con el formato
      adecuado al tipo de ecografía (cardiaca, abdominal o ambas). Hacerlo a mano implica
      leer, clasificar, elegir plantilla y redactar.
  pending:
    - Quién lo sufría (clínica, ecografista ambulante) y cuántos informes se hacen a la semana
    - Cuánto tiempo costaba cada informe antes de EcoTogo

decisions:
  - title: Clasificar las notas con IA al llegar
    context: Las notas entran por WhatsApp sin estructura y pueden ser de varios tipos de estudio.
    decision: >-
      Recibirlas mediante Evolution API y clasificarlas con la API de Claude en tipos de
      informe (CRD, ABD, ABD_CRD…).
    why: Cada nota llega ya etiquetada al flujo correcto, sin clasificarla a mano.
  - title: Un tablero Kanban para el estado de cada estudio
    context: Varios estudios avanzan a la vez y en distinto punto.
    decision: Representar el flujo de trabajo como un tablero Kanban.
    why: De un vistazo se ve qué está pendiente, qué en redacción y qué entregado.
  - title: Las plantillas Word se mantienen
    context: Los informes tienen un formato que ya conocen quienes los reciben.
    decision: >-
      Elegir la plantilla Word según el tipo de estudio y generar con ayuda de IA el
      borrador del informe abdominal.
    why: Cambia cómo se produce el informe, no cómo lo recibe el cliente.

